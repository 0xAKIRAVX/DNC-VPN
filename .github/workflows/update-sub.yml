name: update-sub

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub Actions minimum)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sub
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and aggregate subscriptions
        run: python3 scripts/fetch_subs.py

      - name: Commit updated subs
        run: |
          git config user.name  "dnc-sub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sub.txt sub-extra.txt
          if git diff --cached --quiet; then
            echo "no changes — sources identical"
          else
            git commit -m "sub: refresh $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
